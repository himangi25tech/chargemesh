<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#f7f4ee"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="22" fill="#1c1917">What Muse may do</text>
  <rect x="40" y="80" width="420" height="290" rx="8" fill="#fff" stroke="#166534"/>
  <text x="64" y="116" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#166534">Does</text>
  <text x="64" y="156" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Ask when the car is needed</text>
  <text x="64" y="188" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Show solar, building, EV, grid</text>
  <text x="64" y="220" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Explain a slow charge</text>
  <text x="64" y="252" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Offer now / wait / overnight</text>
  <text x="64" y="284" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Keep the plan if Muse cloud is down</text>
  <text x="64" y="332" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">The Pi holds the last safe plan.</text>
  <rect x="500" y="80" width="420" height="290" rx="8" fill="#fff" stroke="#9a3412"/>
  <text x="524" y="116" font-family="ui-sans-serif, sans-serif" font-size="16" fill="#9a3412">Does not</text>
  <text x="524" y="156" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Switch charger power</text>
  <text x="524" y="188" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Spend money or place an order</text>
  <text x="524" y="220" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Use a laptop VPN as the control path</text>
  <text x="524" y="252" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Promise V2G or a measured CO2 cut</text>
  <text x="524" y="284" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Replace the EVSE or the BMS</text>
  <text x="524" y="332" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">Those stay outside this repo.</text>
</svg>
