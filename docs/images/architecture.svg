<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <rect width="960" height="520" fill="#f7f4ee"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="22" fill="#1c1917">ChargeMesh sits beside Muse, not inside it</text>
  <text x="40" y="68" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#57534e">The gadget explains. The Pi recommends. The charger decides.</text>
  <rect x="40" y="100" width="200" height="88" rx="8" fill="#fff" stroke="#1c1917"/>
  <text x="140" y="132" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Person</text>
  <text x="140" y="156" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">"I need it at 7 AM"</text>
  <rect x="300" y="100" width="220" height="88" rx="8" fill="#fff" stroke="#1c1917"/>
  <text x="410" y="132" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Muse gadget</text>
  <text x="410" y="156" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">ask, explain, show status</text>
  <rect x="580" y="100" width="340" height="88" rx="8" fill="#fff" stroke="#1c1917"/>
  <text x="750" y="132" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Edge Pi</text>
  <text x="750" y="156" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">state, forecast stub, schedule</text>
  <path d="M240 144 H300" stroke="#1c1917" marker-end="url(#a)"/>
  <path d="M520 144 H580" stroke="#1c1917" marker-end="url(#a)"/>
  <rect x="40" y="250" width="250" height="100" rx="8" fill="#fff" stroke="#1c1917"/>
  <text x="165" y="286" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Meters</text>
  <text x="165" y="310" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">solar, building, site cap</text>
  <path d="M290 300 H750 V188" stroke="#1c1917" fill="none" marker-end="url(#a)"/>
  <rect x="360" y="250" width="250" height="100" rx="8" fill="#fff7ed" stroke="#9a3412"/>
  <text x="485" y="286" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#9a3412">Recommendation</text>
  <text x="485" y="310" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#9a3412">now, wait, or overnight</text>
  <path d="M750 188 V250 H610" stroke="#9a3412" fill="none" marker-end="url(#b)"/>
  <rect x="670" y="400" width="250" height="88" rx="8" fill="#fff" stroke="#1c1917"/>
  <text x="795" y="432" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">EVSE / BMS</text>
  <text x="795" y="456" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">later, and it can refuse</text>
  <path d="M795 350 V400" stroke="#1c1917" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="40" y="448" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">Dashed line is not in this repo. v1 stops at the recommendation.</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#1c1917"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9a3412"/>
    </marker>
  </defs>
</svg>
